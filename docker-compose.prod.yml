# ============================================================================
# DB Platform 生产部署拓扑（架构 §17.14，冻结）—— 单机全量
#
# 与 docker-compose.yml（开发/本地）的差异：
#   * 镜像全部来自 GHCR（由 .github/workflows/publish-images.yml 发布），
#     不再有 build:；PLATFORM_VERSION 必填，禁止用 latest 部署。
#   * 持久化数据落在宿主固定路径 DATA_ROOT（默认 /srv/db-platform），
#     便于备份、迁移与容量规划 —— 必须是本地 NVMe/SSD，不能是网络盘。
#   * secrets 从仓库外的 SECRETS_DIR（默认 /etc/db-platform/secrets）注入。
#   * 只发布 web 端口；db-server / Worker / WAL / PostgreSQL / 对象存储一律不发布。
#   * 仍是单机全量拓扑：web + db-server + PostgreSQL + 3 Worker + 3 WAL + 对象存储。
#     DB Process 依旧由 db-worker 容器内部的 Supervisor 拉起，不是一 DB 一容器。
#
# 首次部署：
#   1) 拉取私有 GHCR 包前先登录（包设为 public 则免）：
#        echo "$CR_PAT" | docker login ghcr.io -u <user> --password-stdin
#   2) 生成 secrets 并放到宿主机（不要留在仓库工作区）：
#        ./scripts/gen-secrets.sh            # 写入 deploy/secrets（已被 .gitignore 排除）
#        sudo install -d -m 0755 /etc/db-platform/secrets
#        sudo cp deploy/secrets/*.txt /etc/db-platform/secrets/
#        sudo chmod 0644 /etc/db-platform/secrets/*.txt
#        rm -rf deploy/secrets               # 拷走后就删掉工作区里的副本
#      0644 是必须的：容器内 db-server / 对象存储以 uid 10001 运行，而 file secret
#      是 bind mount 注入，0400 root:root 会导致容器内非 root 进程读不到。
#      生产更稳妥的做法是用 Secret Manager 注入或在节点上收紧目录 ACL。
#   3) 准备数据目录（数据都在这里，务必先挂载好数据盘）：
#        sudo mkdir -p /srv/db-platform/{postgres,wal-1,wal-2,wal-3,object-store/data,object-store/logs,worker-1/{data,run},worker-2/{data,run},worker-3/{data,run}}
#      wal-* 由 wal-init、对象存储由 object-store-init 修正属主，无需手工 chown。
#   4) 提供部署变量（宿主机 /etc/db-platform/prod.env，至少要有 PLATFORM_VERSION）：
#        PLATFORM_VERSION=1.2.3        # 对应 tag v1.2.3（tag 的 v 前缀会被去掉）
#        DATA_ROOT=/srv/db-platform
#        SECRETS_DIR=/etc/db-platform/secrets
#        WEB_PORT=80
#        POSTGRES_DB=dbplatform
#        POSTGRES_USER=dbplatform
#      其余可调变量（RUST_LOG / WORKER_*_MILLI / WAL_APPEND_TIMEOUT_MS / ...）
#      与 .env.example 同名同义。
#   5) docker compose --env-file /etc/db-platform/prod.env -f docker-compose.prod.yml up -d
#      注意：必须带 --env-file。否则在仓库目录里执行时 compose 会自动读取开发用的
#      .env（含本地端口/凭据），生产配置会被静默覆盖。
#
# 资源预算说明：Worker 的 CPU/内存/磁盘预算由 WORKER_* 环境变量表达（Scheduler 按
# 该预算做 Packing），因此这里不给 db-worker 加容器级 CPU/内存上限；若要加，必须
# 保证 limit >= 对应 WORKER_* 预算，否则会误杀整个 Worker 上的所有 DB Process。
# ============================================================================

name: db-platform-prod

x-logging: &default-logging
  logging:
    driver: json-file
    options:
      max-size: "50m"
      max-file: "3"

x-restart: &default-restart
  restart: unless-stopped

services:
  # ------------------------------------------------------------------ Panel
  web:
    # 生产入口只此一处；若前面还有网关/LB 终止 TLS，把 WEB_BIND 设为 127.0.0.1。
    image: "${IMAGE_PREFIX:-ghcr.io/konghayao/peri-loom}/web:${PLATFORM_VERSION:?PLATFORM_VERSION 必填，例如 1.2.3}"
    ports:
      - "${WEB_BIND:-0.0.0.0}:${WEB_PORT:-80}:80"
    networks: [edge]
    depends_on:
      db-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/healthz"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    <<: [*default-logging, *default-restart]

  # ------------------------------------------------------------------ Server Plane
  db-server:
    image: "${IMAGE_PREFIX:-ghcr.io/konghayao/peri-loom}/db-server:${PLATFORM_VERSION:?PLATFORM_VERSION 必填，例如 1.2.3}"
    environment:
      RUST_LOG: "${RUST_LOG:-info}"
      # 密码只从 secret 文件注入（架构 §17.14）：不得在环境变量里出现明文密码，
      # 否则会出现「PostgreSQL 用 secret 初始化、db-server 用 .env 连接」的双事实源。
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: "${POSTGRES_DB:-dbplatform}"
      DB_USER: "${POSTGRES_USER:-dbplatform}"
      DB_PASSWORD_FILE: /run/secrets/postgres_password
      CATALOG_MAX_CONNECTIONS: "${CATALOG_MAX_CONNECTIONS:-32}"
      SERVER_HTTP_LISTEN: "0.0.0.0:8080"
      SERVER_GRPC_LISTEN: "0.0.0.0:8081"
      OPS_LISTEN: "0.0.0.0:9090"
      PLATFORM_MIGRATIONS_DIR: /opt/db-platform/migrations
      ROUTE_RECONCILE_INTERVAL_MS: "${ROUTE_RECONCILE_INTERVAL_MS:-5000}"
      WAKEUP_TIMEOUT_MS: "${WAKEUP_TIMEOUT_MS:-3000}"
      SESSION_IDLE_TIMEOUT_MS: "${SESSION_IDLE_TIMEOUT_MS:-60000}"
      TRANSACTION_MAX_LIFETIME_MS: "${TRANSACTION_MAX_LIFETIME_MS:-30000}"
      INLINE_RESULT_LIMIT_BYTES: "${INLINE_RESULT_LIMIT_BYTES:-262144}"
      JWT_SECRET_FILE: /run/secrets/jwt_secret
      JWT_ISSUER: "${JWT_ISSUER:-db-platform}"
      JWT_TTL_SECONDS: "${JWT_TTL_SECONDS:-3600}"
      BOOTSTRAP_ADMIN_USER: "${BOOTSTRAP_ADMIN_USER:-admin}"
      BOOTSTRAP_ADMIN_PASSWORD_FILE: /run/secrets/bootstrap_admin_password
      S3_ENDPOINT: "${S3_ENDPOINT:-http://object-store:9000}"
      S3_REGION: "${S3_REGION:-us-east-1}"
      S3_BUCKET: "${S3_BUCKET:-db-platform-snapshots}"
      S3_ACCESS_KEY_ID_FILE: /run/secrets/s3_access_key
      S3_SECRET_ACCESS_KEY_FILE: /run/secrets/s3_secret_key
      S3_FORCE_PATH_STYLE: "true"
      # 控制面只读 WAL 状态：启动被 Storage-level Fencing 拒绝时，需要读回 WAL 已记录的
      # owner epoch 才能把 Catalog 对齐到存储层权威（架构 §11.3）。与 Worker 用同一份
      # 拓扑配置，保证两边推导出的端点完全一致。
      WAL_CLUSTER: "${WAL_CLUSTER:-1@wal-1:9201,2@wal-2:9201,3@wal-3:9201}"
      OTEL_EXPORTER_OTLP_ENDPOINT: "${OTEL_EXPORTER_OTLP_ENDPOINT:-}"
    secrets:
      - postgres_password
      - jwt_secret
      - bootstrap_admin_password
      - s3_access_key
      - s3_secret_key
    networks: [edge, internal]
    depends_on:
      postgres:
        condition: service_healthy
    # 生产不发布任何端口：对外只经 web 的 /api、/data、/db 反向代理。
    # 给在途事务留出收尾时间（进程若立即退出则无影响）。
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/readyz"]
      interval: 5s
      timeout: 3s
      retries: 24
      start_period: 15s
    <<: [*default-logging, *default-restart]

  # ------------------------------------------------------------------ PostgreSQL Catalog
  postgres:
    image: "${IMAGE_REGISTRY:-}${POSTGRES_IMAGE:-postgres:16-alpine}"
    environment:
      POSTGRES_DB: "${POSTGRES_DB:-dbplatform}"
      POSTGRES_USER: "${POSTGRES_USER:-dbplatform}"
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      # 控制面需要并发事务与 advisory lock，连接数按 Server 规模设置
      POSTGRES_INITDB_ARGS: "--data-checksums"
    secrets:
      - postgres_password
    volumes:
      # 权威事实源：备份策略必须覆盖这个目录
      - "${DATA_ROOT:-/srv/db-platform}/postgres:/var/lib/postgresql/data"
    networks: [internal]
    # 让 fast shutdown 有足够时间收尾（默认 10s 后 SIGKILL）
    stop_grace_period: 60s
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dbplatform} -d ${POSTGRES_DB:-dbplatform}"]
      interval: 3s
      timeout: 3s
      retries: 30
      start_period: 5s
    <<: [*default-logging, *default-restart]
    # 不发布端口：PostgreSQL 只在内网可达

  # ------------------------------------------------------------------ Worker Plane
  db-worker-1:
    image: "${IMAGE_PREFIX:-ghcr.io/konghayao/peri-loom}/db-worker:${PLATFORM_VERSION:?PLATFORM_VERSION 必填，例如 1.2.3}"
    environment:
      RUST_LOG: "${RUST_LOG:-info}"
      WORKER_ID: worker-1
      WORKER_CONTROL_LISTEN: "0.0.0.0:9100"
      WORKER_DATA_LISTEN: "0.0.0.0:9101"
      OPS_LISTEN: "0.0.0.0:9090"
      SERVER_CONTROL_ENDPOINT: "http://db-server:8081"
      # 对外通告地址必须可被 db-server 解析：监听地址是 0.0.0.0，不能作为路由目标。
      WORKER_ADVERTISE_ENDPOINT: "db-worker-1:9100"
      WORKER_ADVERTISE_DATA_ENDPOINT: "db-worker-1:9101"
      WORKER_DATA_DIR: /var/lib/db-platform
      WORKER_RUN_DIR: /run/db-platform
      # 资源预算须与本机实际资源一致，否则 Scheduler Packing 失真（架构 §9）
      WORKER_CPU_MILLI: "${WORKER_CPU_MILLI:-32000}"
      WORKER_MEMORY_MIB: "${WORKER_MEMORY_MIB:-131072}"
      WORKER_DISK_MIB: "${WORKER_DISK_MIB:-512000}"
      WORKER_PROCESS_SLOTS: "${WORKER_PROCESS_SLOTS:-2048}"
      WORKER_MAX_DB_PROCESS: "${WORKER_MAX_DB_PROCESS:-2000}"
      HEARTBEAT_INTERVAL_MS: "${HEARTBEAT_INTERVAL_MS:-1000}"
      CGROUP_ROOT: "${WORKER_CGROUP_ROOT:-/sys/fs/cgroup}"
      DB_RUNTIME_BIN: /usr/local/bin/db-runtime
      WAL_CLUSTER: "${WAL_CLUSTER:-1@wal-1:9201,2@wal-2:9201,3@wal-3:9201}"
      S3_ENDPOINT: "${S3_ENDPOINT:-http://object-store:9000}"
      S3_BUCKET: "${S3_BUCKET:-db-platform-snapshots}"
      S3_ACCESS_KEY_ID_FILE: /run/secrets/s3_access_key
      S3_SECRET_ACCESS_KEY_FILE: /run/secrets/s3_secret_key
      S3_FORCE_PATH_STYLE: "true"
    secrets:
      - s3_access_key
      - s3_secret_key
    # Worker 需要创建 per-DB cgroup 并管理大量子进程（架构 §17.14）。
    # 这里采用最小化收敛：host cgroup namespace + SYS_ADMIN + 读写挂载 /sys/fs/cgroup。
    # 若内核/容器运行时不允许委派，可退回 privileged: true（不改变“DB Process 是
    # 普通子进程”的模型）。
    cgroup: host
    cap_add:
      - SYS_ADMIN
      - SYS_NICE
    security_opt:
      - apparmor:unconfined
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
      # Local NVMe 工作集：必须落在本地盘，不要指向网络存储
      - "${DATA_ROOT:-/srv/db-platform}/worker-1/data:/var/lib/db-platform"
      - "${DATA_ROOT:-/srv/db-platform}/worker-1/run:/run/db-platform"
    tmpfs:
      - /run/db-platform/sockets:mode=0755
    networks: [internal]
    depends_on:
      db-server:
        condition: service_healthy
      wal-1:
        condition: service_healthy
    # 停止时要逐个回收 DB Process（默认 10s 后 SIGKILL 会留下脏工作集）
    stop_grace_period: 60s
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9090/healthz"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    <<: [*default-logging, *default-restart]

  db-worker-2:
    extends:
      service: db-worker-1
    environment:
      WORKER_ID: worker-2
      WORKER_ADVERTISE_ENDPOINT: "db-worker-2:9100"
      WORKER_ADVERTISE_DATA_ENDPOINT: "db-worker-2:9101"
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
      - "${DATA_ROOT:-/srv/db-platform}/worker-2/data:/var/lib/db-platform"
      - "${DATA_ROOT:-/srv/db-platform}/worker-2/run:/run/db-platform"
    tmpfs:
      - /run/db-platform/sockets:mode=0755

  db-worker-3:
    extends:
      service: db-worker-1
    environment:
      WORKER_ID: worker-3
      WORKER_ADVERTISE_ENDPOINT: "db-worker-3:9100"
      WORKER_ADVERTISE_DATA_ENDPOINT: "db-worker-3:9101"
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
      - "${DATA_ROOT:-/srv/db-platform}/worker-3/data:/var/lib/db-platform"
      - "${DATA_ROOT:-/srv/db-platform}/worker-3/run:/run/db-platform"
    tmpfs:
      - /run/db-platform/sockets:mode=0755

  # ------------------------------------------------------------------ Storage Plane: Remote WAL
  # 基线部署 = 一个 3 副本 Raft WAL Group（架构 §17.14）
  wal-1:
    image: "${IMAGE_PREFIX:-ghcr.io/konghayao/peri-loom}/wal-service:${PLATFORM_VERSION:?PLATFORM_VERSION 必填，例如 1.2.3}"
    environment: &wal-env
      RUST_LOG: "${RUST_LOG:-info}"
      WAL_NODE_ID: "1"
      WAL_SHARD_ID: shard-0
      WAL_LISTEN: "0.0.0.0:9200"
      WAL_PEER_LISTEN: "0.0.0.0:9201"
      OPS_LISTEN: "0.0.0.0:9300"
      WAL_DATA_DIR: /var/lib/db-platform/wal
      WAL_CLUSTER: "${WAL_CLUSTER:-1@wal-1:9201,2@wal-2:9201,3@wal-3:9201}"
      WAL_APPEND_TIMEOUT_MS: "${WAL_APPEND_TIMEOUT_MS:-5000}"
      WAL_TRIM_INTERVAL_MS: "${WAL_TRIM_INTERVAL_MS:-60000}"
      S3_ENDPOINT: "${S3_ENDPOINT:-http://object-store:9000}"
    volumes:
      - "${DATA_ROOT:-/srv/db-platform}/wal-1:/var/lib/db-platform/wal"
    networks: [internal]
    depends_on:
      # bind mount 与 named volume 不同：宿主目录由 Docker 以 root 创建，
      # 必须先由 wal-init 交给容器内运行的 uid 10001，否则 WAL 无法写入。
      wal-init:
        condition: service_completed_successfully
    # 停止时先让已提交的日志落盘
    stop_grace_period: 60s
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9300/healthz"]
      interval: 3s
      timeout: 3s
      retries: 30
      start_period: 5s
    <<: [*default-logging, *default-restart]

  wal-2:
    extends:
      service: wal-1
    environment:
      <<: *wal-env
      WAL_NODE_ID: "2"
    volumes:
      - "${DATA_ROOT:-/srv/db-platform}/wal-2:/var/lib/db-platform/wal"

  wal-3:
    extends:
      service: wal-1
    environment:
      <<: *wal-env
      WAL_NODE_ID: "3"
    volumes:
      - "${DATA_ROOT:-/srv/db-platform}/wal-3:/var/lib/db-platform/wal"

  # 卷属主修正：wal-service 镜像以 uid 10001 运行，而 Docker 自动创建的宿主目录
  # 属于 root。用一次性 init 容器准备好，避免让 WAL 以 root 运行。
  wal-init:
    image: "${IMAGE_REGISTRY:-}${RUNTIME_IMAGE:-debian:bookworm-slim}"
    user: "0:0"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        chown -R 10001:10001 /wal/1 /wal/2 /wal/3
        echo "wal data dirs ready"
    volumes:
      - "${DATA_ROOT:-/srv/db-platform}/wal-1:/wal/1"
      - "${DATA_ROOT:-/srv/db-platform}/wal-2:/wal/2"
      - "${DATA_ROOT:-/srv/db-platform}/wal-3:/wal/3"
    networks: [internal]
    restart: "no"

  # ------------------------------------------------------------------ S3-compatible ObjectStore
  # Snapshot / Backup 的长期持久化（架构 §17.9）。
  #
  # 为什么是 RustFS 而不是 MinIO：MinIO 社区版自 2025 年起停止发布官方镜像并转向
  # AGPLv3 授权，不再适合作为平台默认依赖。RustFS 同样是 S3 兼容对象存储、
  # Apache-2.0 授权、支持 path-style 与 *_FILE 形式的凭据注入。
  # 平台侧只依赖 ObjectStore interface 与 S3 API，可随时替换为 AWS S3 / Ceph RGW 等。
  #
  # 版本固定在 1.0.0：同 digest 的 latest 与 1.0.0 实测正常，而更早的 1.0.0-alpha.72
  # 在本机会在启动后 panic（crc-fast 报 "x86 features missing (SSE4.1 && PCLMULQDQ)"）后退出。
  # 不要因为“看起来更新”就换回 alpha 标签，也不要用 latest（不可复现）。
  object-store:
    image: "${IMAGE_REGISTRY:-}${OBJECT_STORE_IMAGE:-rustfs/rustfs:1.0.0}"
    # RustFS 默认以非 root 用户（uid 10001）运行，卷目录需要先归它所有
    user: "10001:10001"
    environment:
      RUSTFS_VOLUMES: /data
      RUSTFS_ADDRESS: ":9000"
      RUSTFS_CONSOLE_ENABLE: "false"
      # 凭据走文件注入（与 §17.14 的 secrets 契约一致），不落到环境变量明文里
      RUSTFS_ACCESS_KEY_FILE: /run/secrets/s3_access_key
      RUSTFS_SECRET_KEY_FILE: /run/secrets/s3_secret_key
      RUSTFS_OBS_LOGGER_LEVEL: warn
    secrets:
      - s3_access_key
      - s3_secret_key
    volumes:
      # 快照 / 备份的长期存放位置，容量规划与备份策略都要覆盖它
      - "${DATA_ROOT:-/srv/db-platform}/object-store/data:/data"
      - "${DATA_ROOT:-/srv/db-platform}/object-store/logs:/logs"
    networks: [internal]
    depends_on:
      object-store-init:
        condition: service_completed_successfully
    healthcheck:
      # RustFS 在 S3 端口上提供 /health
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9000/health"]
      interval: 3s
      timeout: 3s
      retries: 30
      start_period: 5s
    <<: [*default-logging, *default-restart]

  # 卷目录属主修正：RustFS 以 uid 10001 运行，而 Docker 自动创建的宿主目录属于 root。
  # 用一次性 init 容器把它准备好，避免让对象存储进程以 root 运行。
  object-store-init:
    image: "${IMAGE_REGISTRY:-}${RUNTIME_IMAGE:-debian:bookworm-slim}"
    user: "0:0"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        chown -R 10001:10001 /data /logs
        echo "object store volumes ready"
    volumes:
      - "${DATA_ROOT:-/srv/db-platform}/object-store/data:/data"
      - "${DATA_ROOT:-/srv/db-platform}/object-store/logs:/logs"
    networks: [internal]
    restart: "no"

  # ------------------------------------------------------------------ Observability（可选 profile）
  # 这三个服务的数据不是权威事实源，所以保留 named volume（省去宿主属主处理）。
  otel-collector:
    image: "${IMAGE_REGISTRY:-}otel/opentelemetry-collector-contrib:0.121.0"
    profiles: ["observability"]
    command: ["--config=/etc/otel/collector.yaml"]
    volumes:
      - ./deploy/otel/collector.yaml:/etc/otel/collector.yaml:ro
    networks: [internal]
    healthcheck:
      test: ["CMD", "/otelcol-contrib", "--version"]
      interval: 10s
      timeout: 5s
      retries: 6
    <<: [*default-logging, *default-restart]

  prometheus:
    image: "${IMAGE_REGISTRY:-}prom/prometheus:v2.55.1"
    profiles: ["observability"]
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=7d"
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    networks: [internal]
    <<: [*default-logging, *default-restart]

  grafana:
    image: "${IMAGE_REGISTRY:-}grafana/grafana:11.4.0"
    profiles: ["observability"]
    environment:
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/secrets/grafana_admin_password
      GF_USERS_ALLOW_SIGN_UP: "false"
    secrets:
      - grafana_admin_password
    volumes:
      - grafana_data:/var/lib/grafana
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
    networks: [internal]
    <<: [*default-logging, *default-restart]

networks:
  # 只承载 web <-> db-server
  edge:
    driver: bridge
  # 控制面、数据面、存储面全部走内网，不对宿主机发布端口
  internal:
    driver: bridge
    internal: false

volumes:
  # 仅观测栈使用 named volume；核心数据都在 DATA_ROOT 的 bind mount 上
  prometheus_data:
  grafana_data:

secrets:
  # 生产 secrets 位于仓库工作区之外
  postgres_password:
    file: "${SECRETS_DIR:-/etc/db-platform/secrets}/postgres_password.txt"
  jwt_secret:
    file: "${SECRETS_DIR:-/etc/db-platform/secrets}/jwt_secret.txt"
  bootstrap_admin_password:
    file: "${SECRETS_DIR:-/etc/db-platform/secrets}/bootstrap_admin_password.txt"
