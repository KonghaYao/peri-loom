# DBA Panel 反向代理（架构 §17.14 Web Container）。
#
# 目标：Browser 与 API 默认同 Origin，不依赖宽泛 CORS。
#   /         -> SPA 静态文件
#   /api/*    -> db-server:8080（Management / DBA REST JSON）
#   /data/*   -> db-server:8080（SQL / Data API，含 NDJSON streaming）
#
# 关键点：/data/ 必须关闭 proxy_buffering，否则大结果集会在 nginx 内被聚合，
# 违背“Server 不得无上限缓存完整结果集 + HTTP backpressure 逐行输出”的契约。

upstream db_platform_server {
    server db-server:8080;
    keepalive 64;
}

server {
    listen 80;
    server_name _;

    # SPA 静态资源
    root /usr/share/nginx/html;
    index index.html;

    # 安全响应头（Panel 只读静态 + API）
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;

    client_max_body_size 64m;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # 静态资源长缓存（Vite 产物带内容 hash）
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Management / DBA API
    location /api/ {
        proxy_pass http://db_platform_server;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Connection "";
        # 长操作（Move / Backup / Restore）与 SSE 场景
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # Data API：必须逐帧转发，禁止聚合大结果集
    location /data/ {
        proxy_pass http://db_platform_server;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Connection "";

        proxy_buffering off;
        proxy_request_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;

        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # 健康检查（不经 db-server，避免依赖下游状态）
    location /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # /metrics 不得经公网暴露（架构 §17.4）：Panel 侧直接拒绝
    location /metrics {
        deny all;
        return 403;
    }
}
