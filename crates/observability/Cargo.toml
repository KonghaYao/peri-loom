[package]
name = "observability"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

# 业务代码只产生 tracing span/event 与 metrics；不直接绑定 Grafana/Loki/Tempo SDK（架构 §17.10）
[dependencies]
domain.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
metrics.workspace = true
metrics-exporter-prometheus.workspace = true
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
http.workspace = true
axum.workspace = true

[dependencies.tracing-opentelemetry]
workspace = true
optional = true

[dependencies.opentelemetry]
workspace = true
optional = true

[dependencies.opentelemetry_sdk]
workspace = true
optional = true

[dependencies.opentelemetry-otlp]
workspace = true
optional = true

[features]
default = []
# OTLP export 为可选：默认关闭以避免在无 collector 环境产生启动阻塞
otlp = ["dep:tracing-opentelemetry", "dep:opentelemetry", "dep:opentelemetry_sdk", "dep:opentelemetry-otlp"]
