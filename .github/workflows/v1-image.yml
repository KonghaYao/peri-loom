name: v1 service image

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  # 上线门禁：P0 测试集未通过时 build（以及其后的 publish 与 release）不会运行。
  p0:
    uses: ./.github/workflows/p0-gate.yml

  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false
      - name: Check release version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          version="$(python3 -c 'import tomllib; print(tomllib.load(open("prototypes/v1/Cargo.toml", "rb"))["package"]["version"])')"
          if [[ "$RELEASE_TAG" != "v$version" ]]; then
            echo "Release tag $RELEASE_TAG does not match v1 version v$version" >&2
            exit 1
          fi
      - name: Check deployment configuration and image verifier
        env:
          PERI_IMAGE: peri-loom:release
          S3_ENDPOINT: https://s3.example.com
          S3_BUCKET: disposable-ci-bucket
          S3_REGION: us-east-1
          S3_ACCESS_KEY_ID: test-access-key
          S3_SECRET_ACCESS_KEY: test-secret-key
        run: |
          docker compose config --quiet
          docker compose -f prototypes/v1/deploy/compose.yaml config --quiet
          MINIO_IMAGE=minio:ci MINIO_MC_IMAGE=minio-mc:ci PERI_TEST_BUCKET=disposable-ci-bucket MINIO_ROOT_USER=testuser MINIO_ROOT_PASSWORD=testpassword docker compose -f prototypes/v1/deploy/compose.yaml -f prototypes/v1/deploy/compose.minio.yaml --profile minio config --quiet
          python3 -m unittest discover -s prototypes/v1/deploy/tests -p 'test_compose.py'
          python3 -m unittest discover -s prototypes/v1/deploy/tests -p 'test_verify_image.py'

  # One native runner per architecture: the Rust/Turso native dependency and the
  # CGO Go build are compiled on the machine that will run them. Each runner
  # verifies the image it built, on its own architecture, before publishing.
  build:
    needs: [check, p0]
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
            platform: linux/amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
            platform: linux/arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false
      - uses: docker/setup-buildx-action@v3
      - name: Build service image for ${{ matrix.platform }}
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          docker buildx build --platform ${{ matrix.platform }} --load \
            --build-arg VERSION="$RELEASE_TAG" \
            --build-arg REVISION="$GITHUB_SHA" \
            -f prototypes/v1/deploy/Dockerfile -t peri-loom:release .
      - name: Verify service, same-volume restart, and clean shutdown
        run: python3 prototypes/v1/deploy/verify-image.py --image peri-loom:release
      - name: Record the architecture this runner actually executed
        run: |
          docker run --rm --platform ${{ matrix.platform }} --entrypoint sh peri-loom:release -c 'uname -m; ldd /usr/local/bin/peri-loom-v1'
          test "$(docker image inspect peri-loom:release --format '{{.Architecture}}')" = "${{ matrix.arch }}"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish the verified ${{ matrix.arch }} image
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}:${RELEASE_TAG}-${{ matrix.arch }}"
          docker tag peri-loom:release "$image"
          docker push "$image"
          docker buildx imagetools inspect "$image"

  # The release tag only ever points at a manifest list whose members were each
  # built and verified on their own native runner.
  publish:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
      packages: write
    steps:
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Assemble the multi-architecture manifest
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          docker buildx imagetools create --tag "${image}:${RELEASE_TAG}" \
            "${image}:${RELEASE_TAG}-amd64" "${image}:${RELEASE_TAG}-arm64"
          docker buildx imagetools inspect "${image}:${RELEASE_TAG}"
      - name: Create preview release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}:$RELEASE_TAG"
          printf 'Verified Linux service images: `%s`\n\nThe P0 release gate (`scripts/p0-gate.sh`) passed before either image was built: every `prototypes/p0` test and the pinned Turso SQL smoke. The released tag is a multi-architecture manifest list whose `linux/amd64` and `linux/arm64` members were each built and verified natively; `%s-amd64` and `%s-arm64` pin one platform each. Apple Silicon no longer has to run the amd64 image under emulation.\n\nThis is a preview: clean restart and acknowledged SQL recovery are tested with a persistent local volume. Dirty restart remains denied; disaster recovery, live external S3 and HA are not certified by this workflow. Do not use as a production release.\n\nFor local testing, follow `prototypes/v1/deploy/README.md` and set `PERI_IMAGE=%s` and prepare `deploy/dev-tls` before running Compose.\n' "$image" "$image" "$image" "$image" > "$RUNNER_TEMP/notes.md"
          # This job deliberately skips actions/checkout (it only talks to the registry), so `gh`
          # has no local repository to infer the target from: name it explicitly.
          gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --prerelease --title "$RELEASE_TAG" --notes-file "$RUNNER_TEMP/notes.md"
