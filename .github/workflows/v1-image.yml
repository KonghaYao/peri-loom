name: v1 service image

on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false
      - name: Check release version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          version="$(python3 -c 'import tomllib; print(tomllib.load(open("prototypes/v1/Cargo.toml", "rb"))["package"]["version"])')"
          if [[ "$RELEASE_TAG" != "v$version" ]]; then
            echo "Release tag $RELEASE_TAG does not match v1 version v$version" >&2
            exit 1
          fi
      - name: Check deployment configuration and image verifier
        env:
          PERI_IMAGE: peri-loom:release
          S3_ENDPOINT: https://s3.example.com
          S3_BUCKET: disposable-ci-bucket
          S3_REGION: us-east-1
          S3_ACCESS_KEY_ID: test-access-key
          S3_SECRET_ACCESS_KEY: test-secret-key
        run: |
          docker compose config --quiet
          docker compose -f prototypes/v1/deploy/compose.yaml config --quiet
          MINIO_IMAGE=minio:ci MINIO_MC_IMAGE=minio-mc:ci PERI_TEST_BUCKET=disposable-ci-bucket MINIO_ROOT_USER=testuser MINIO_ROOT_PASSWORD=testpassword docker compose -f prototypes/v1/deploy/compose.yaml -f prototypes/v1/deploy/compose.minio.yaml --profile minio config --quiet
          python3 -m unittest discover -s prototypes/v1/deploy/tests -p 'test_compose.py'
          python3 -m unittest discover -s prototypes/v1/deploy/tests -p 'test_verify_image.py'
      - name: Build service image
        run: docker build -f prototypes/v1/deploy/Dockerfile -t peri-loom:release .
      - name: Verify service, same-volume restart, and clean shutdown
        run: python3 prototypes/v1/deploy/verify-image.py --image peri-loom:release
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish verified image
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}:$RELEASE_TAG"
          docker tag peri-loom:release "$image"
          docker push "$image"
      - name: Create preview release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}:$RELEASE_TAG"
          printf 'Verified Linux service image: `%s`\n\nThis is a preview: clean restart and acknowledged SQL recovery are tested with a persistent local volume. Dirty restart remains denied; disaster recovery, live external S3 and HA are not certified by this workflow. Do not use as a production release.\n\nFor local testing, follow `prototypes/v1/deploy/README.md` and set `PERI_IMAGE=%s` and prepare `deploy/dev-tls` before running Compose.\n' "$image" "$image" > "$RUNNER_TEMP/notes.md"
          gh release create "$RELEASE_TAG" --verify-tag --prerelease --title "$RELEASE_TAG" --notes-file "$RUNNER_TEMP/notes.md"
