name: v1 service image

on:
  push:
    branches:
      - '**'
    paths:
      - prototypes/v1/**
      - prototypes/p0/turso
      - .github/workflows/v1-image.yml
    tags:
      - 'v*'
  pull_request:
    paths:
      - prototypes/v1/**
      - prototypes/p0/turso
      - .github/workflows/v1-image.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false
      - name: Check deployment configuration and image verifier
        env:
          PERI_TLS_DIR: /tmp
        run: |
          docker compose -f prototypes/v1/deploy/compose.yaml config --quiet
          python3 -m unittest discover -s prototypes/v1/deploy/tests -p 'test_verify_image.py'
      - name: Build service image
        run: docker build -f prototypes/v1/deploy/Dockerfile -t peri-loom:ci .
      - name: Verify service and clean shutdown
        run: python3 prototypes/v1/deploy/verify-image.py --image peri-loom:ci

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false
      - name: Check release version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          version="$(python3 -c 'import tomllib; print(tomllib.load(open("prototypes/v1/Cargo.toml", "rb"))["package"]["version"])')"
          if [[ "$RELEASE_TAG" != "v$version" ]]; then
            echo "Release tag $RELEASE_TAG does not match v1 version v$version" >&2
            exit 1
          fi
      - name: Build and verify release image
        run: |
          docker build -f prototypes/v1/deploy/Dockerfile -t peri-loom:release .
          python3 prototypes/v1/deploy/verify-image.py --image peri-loom:release
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish verified image
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}:$RELEASE_TAG"
          docker tag peri-loom:release "$image"
          docker push "$image"
      - name: Create preview release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}:$RELEASE_TAG"
          printf 'Verified Linux service image: `%s`\n\nThis is a preview: clean restart with a persistent state volume is not yet verified. Do not use as a production release.\n\nFor local testing, follow `prototypes/v1/deploy/README.md` and set `PERI_IMAGE=%s` and `PERI_TLS_DIR` before running Compose.\n' "$image" "$image" > "$RUNNER_TEMP/notes.md"
          gh release create "$RELEASE_TAG" --verify-tag --prerelease --title "$RELEASE_TAG" --notes-file "$RUNNER_TEMP/notes.md"
