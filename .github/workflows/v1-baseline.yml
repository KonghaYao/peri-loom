name: v1 SQL and SDK baseline

# Release tags (`v*`) are handled exactly once by v1-image's workflow_call, so the
# standalone workflow excludes them to avoid a duplicate gate. Other tags still run
# standalone, preserving the previous p0 coverage for every non-release ref.
# `workflow_dispatch` remains for rerunning the gate by hand.
on:
  push:
    branches:
      - '**'
    tags-ignore:
      - 'v*'
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

env:
  # Single knob for the matrix round count: the coverage guard and the matrix script
  # both read it. The blocking matrix declares 27 scripts but default-executes 26/27 per
  # round because E1 is an explicit known-gap; it is not a full compatibility pass.
  # Per-run contexts are unavailable at workflow-level; evidence paths are step-level.
  PERI_HRANA_TEST_ROUNDS: '2'

jobs:
  baseline:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          persist-credentials: false
      - name: Record source revisions
        shell: bash
        run: |
          set -euo pipefail
          echo "Platform SHA: $(git rev-parse HEAD)"
          for path in prototypes/p0/turso third_party/sqlite; do
            expected="$(git ls-tree HEAD "$path" | awk '{print $3}')"
            actual="$(git -C "$path" rev-parse HEAD)"
            echo "$path gitlink: $expected"
            test -n "$expected" && test "$actual" = "$expected"
          done
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            prototypes/v1/platform/tests/hrana-sdk/package-lock.json
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'
      - uses: actions/setup-go@v5
        with:
          go-version-file: prototypes/v1/platform/go.mod
          cache-dependency-path: prototypes/v1/platform/go.sum
      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install 1.98.1 --profile minimal
          rustup toolchain install 1.88 --profile minimal
      - name: Build console before Go embed
        working-directory: prototypes/v1/platform/frontend
        run: |
          bun install --frozen-lockfile
          bun run typecheck
          bun run test
          bun run build
      - name: Go unit smoke (controller registry/reconcile; platform gateway/audit)
        shell: bash
        run: |
          set -euo pipefail
          (cd prototypes/v1/controller && go test . -count=1 -run '^(TestRegistryRequiresHeartbeatAndPreservesRestartState|TestReconcileLostGrantACKReplaysExactDurableReceiptAfterRestart)$')
          (cd prototypes/v1/platform && go test . -count=1 -run '^(TestAdminHandlerServesBuiltConsole|TestGatewayTenantProjectSubjectAndOpaqueIsolation|TestGatewayAuditAfterCommitFailurePreservesKnownExecutionAndRedacts|TestGatewayAuditFailureDoesNotClearUnknownExecution)$')
          (cd prototypes/v1/platform && go build -o "$GITHUB_WORKSPACE/peri-platform" ./cmd/peri-platform)
      - name: Native service and SDK dependencies
        shell: bash
        run: |
          set -euo pipefail
          cargo build --manifest-path prototypes/v1/Cargo.toml --locked
          (cd prototypes/v1/platform/tests/hrana-sdk && npm ci)
      # Declared coverage is 27 scripts. Default execution is 26/27 per round because
      # E1 (http-abort-write-cursor-live.mjs) is an explicit known gap: HTTP v3
      # write-cursor abort has no acknowledged rollback proof. The blocking gate must
      # not claim 27/27 execution or full Hrana compatibility.
      - name: Self-test SDK matrix evidence redaction
        shell: bash
        run: bash scripts/redact-matrix-evidence.sh --self-test
      - name: Verify official SDK matrix coverage
        shell: bash
        env:
          PERI_SDK_MATRIX_EVIDENCE: ${{ runner.temp }}/v1-sdk-matrix
        run: |
          set -euo pipefail
          mkdir -p "$PERI_SDK_MATRIX_EVIDENCE"
          bash scripts/verify-sdk-matrix.sh | tee "$PERI_SDK_MATRIX_EVIDENCE/coverage.txt"
      - name: Official JS SDK matrix (declared 27/27; default executed 26/27 per round; E1 known-gap skipped)
        shell: bash
        timeout-minutes: 20
        env:
          PERI_HRANA_EXPERIMENTAL: '1'
          PERI_PLATFORM_BINARY: ${{ github.workspace }}/peri-platform
          PERI_RUST_BINARY: ${{ github.workspace }}/prototypes/v1/target/debug/peri-loom-v1
          PERI_SDK_MATRIX_EVIDENCE: ${{ runner.temp }}/v1-sdk-matrix
        run: |
          set -euo pipefail
          mkdir -p "$PERI_SDK_MATRIX_EVIDENCE"
          # run-matrix-live.sh owns the launcher, readiness, TLS CA, known-gap skip,
          # and failure semantics; TMPDIR only relocates its fixture logs.
          TMPDIR="$PERI_SDK_MATRIX_EVIDENCE" \
            bash prototypes/v1/platform/tests/hrana-sdk/run-matrix-live.sh
      # These steps must run after a failed or timed-out matrix step so failures are
      # still downloadable; neither step may mask the matrix exit status.
      - name: Redact credentials from SDK matrix evidence
        id: redact
        if: always()
        shell: bash
        run: bash scripts/redact-matrix-evidence.sh "${{ runner.temp }}/v1-sdk-matrix"
      - name: Upload SDK matrix evidence
        if: always() && steps.redact.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: v1-sdk-matrix-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/v1-sdk-matrix/coverage.txt
            ${{ runner.temp }}/v1-sdk-matrix/*/matrix.log
            ${{ runner.temp }}/v1-sdk-matrix/*/launcher.log
          if-no-files-found: warn
          retention-days: 14

  # 发布门禁：与 baseline 并行执行；命令单一维护在 scripts/p0-gate.sh，
  # 与 tag 发布工作流调用同一个可复用工作流。
  p0:
    uses: ./.github/workflows/p0-gate.yml
