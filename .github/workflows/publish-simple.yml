# 原生单文件交付；三个平台全部验证后才发布 GitHub Release。
name: publish-simple

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: publish-simple-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Binary (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - runner: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
          - runner: macos-14
            target: aarch64-apple-darwin
    env:
      CARGO_BUILD_JOBS: '2'
      MACOSX_DEPLOYMENT_TARGET: '13.0'
    steps:
      - uses: actions/checkout@v4

      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config cmake

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      # Simple 不依赖 raft-proto，使用支持 proto3 optional 的 protoc 即可。
      - uses: arduino/setup-protoc@v3
        with:
          version: '28.3'
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install repository Rust toolchain
        run: |
          toolchain="$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)"
          test -n "$toolchain"
          rustup toolchain install "$toolchain" --profile minimal
          rustup show active-toolchain
          rustc --version

      - uses: Swatinem/rust-cache@v2
        with:
          key: simple-${{ matrix.target }}

      - name: Build embedded Web and native binary
        env:
          EXPECTED_TARGET: ${{ matrix.target }}
        run: |
          test "$(rustc -vV | sed -n 's/^host: //p')" = "$EXPECTED_TARGET"
          bash scripts/build-simple.sh

      - name: Package and verify extracted binary
        env:
          TARGET: ${{ matrix.target }}
        run: |
          python3 scripts/package-simple.py target/release/peri-loom "$TARGET" "$GITHUB_REF_NAME" dist
          mkdir unpacked
          tar -xzf dist/*.tar.gz -C unpacked
          python3 scripts/smoke-simple.py unpacked/peri-loom

      - uses: actions/upload-artifact@v4
        with:
          name: simple-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish native binaries
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: simple-*
          merge-multiple: true
          path: dist

      - name: Verify all release assets
        working-directory: dist
        run: |
          test "$(find . -name '*.tar.gz' | wc -l)" -eq 3
          cat ./*.sha256 > SHA256SUMS
          sha256sum --check SHA256SUMS

      - name: Publish complete release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          # 保留草稿直到附件全部上传；已发布版本不原地替换二进制。
          if gh release view "$RELEASE_TAG" --json isDraft > release-state.json; then
            python3 -c 'import json; assert json.load(open("release-state.json"))["isDraft"], "Release already published; use a new version tag"'
          else
            gh release create "$RELEASE_TAG" --verify-tag --draft --generate-notes --title "$RELEASE_TAG"
          fi
          gh release upload "$RELEASE_TAG" dist/* --clobber
          if [[ "$RELEASE_TAG" == *-* ]]; then
            gh release edit "$RELEASE_TAG" --draft=false --prerelease --latest=false
          else
            gh release edit "$RELEASE_TAG" --draft=false --latest
          fi

  verify-mise:
    name: Install with mise (${{ matrix.runner }})
    needs: release
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-22.04, ubuntu-22.04-arm, macos-14]
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
        with:
          install: false
          cache: false
      - name: Install released asset and smoke test
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_REPOSITORY: ${{ github.repository }}
        run: |
          tool="github:${RELEASE_REPOSITORY}@${RELEASE_TAG}"
          if [[ "$RELEASE_TAG" == *-* ]]; then
            tool="github:${RELEASE_REPOSITORY}[prerelease=true]@${RELEASE_TAG}"
          fi
          mise install "$tool"
          binary="$(mise exec "$tool" -- which peri-loom)"
          python3 scripts/smoke-simple.py "$binary"
