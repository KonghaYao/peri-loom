name: publish-simple-image

on:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-simple-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and push Simple image
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost
          sudo docker image prune -af

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}/simple" >> "$GITHUB_OUTPUT"

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.simple
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            RUSTUP_DIST_SERVER=https://static.rust-lang.org
            RUSTUP_UPDATE_ROOT=https://static.rust-lang.org/rustup
            USE_OFFICIAL_CRATES=true
          cache-from: type=gha,scope=simple
          cache-to: type=gha,mode=max,scope=simple

      - name: Summary
        run: echo "Published ${{ steps.image.outputs.name }} at \`${{ steps.build.outputs.digest }}\`" >> "$GITHUB_STEP_SUMMARY"
