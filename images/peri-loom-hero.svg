    <text x="88" y="311" font-size="38" font-weight="400" letter-spacing="-1" fill="#78e3c2">SQL, untethered.</text>
    <text x="88" y="375" font-size="19" fill="#a8bbcd">Your databases. Your storage.</text>
    <text x="88" y="405" font-size="19" fill="#a8bbcd">Your infrastructure.</text>
    <text x="88" y="482" font-size="12" letter-spacing="2.5" fill="#728ba0">COMPUTE IS REPLACEABLE. DATA IS NOT.</text>
