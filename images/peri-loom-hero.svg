<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="560" viewBox="0 0 1440 560" role="img" aria-labelledby="title desc">
  <title id="title">peri-loom — SQL, untethered.</title>
  <desc id="desc">Mint and blue data threads weave between independent compute nodes and layered storage on a midnight background. Your databases. Your storage. Your infrastructure.</desc>
