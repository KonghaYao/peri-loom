    <linearGradient id="background" x2="1" y2="1">
      <stop stop-color="#101c2b"/>
      <stop offset="1" stop-color="#080f1b"/>
    </linearGradient>
    <linearGradient id="thread" x2="1">
      <stop stop-color="#70dfbe" stop-opacity="0.1"/>
      <stop offset="0.4" stop-color="#70dfbe"/>
      <stop offset="1" stop-color="#84aef5"/>
    </linearGradient>
    <linearGradient id="panel" x2="0.8" y2="1">
      <stop stop-color="#263d4a"/>
      <stop offset="1" stop-color="#142233"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
