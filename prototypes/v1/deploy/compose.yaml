services:
  app:
    image: ${PERI_IMAGE:-peri-loom:local}
    build:
      context: ../../..
      dockerfile: prototypes/v1/deploy/Dockerfile
    init: true
    ports:
      - "${PERI_BIND_IP:-127.0.0.1}:${PERI_GATEWAY_PORT:-9443}:9443"
    environment:
      PERI_TLS_CERT: /run/tls/tls.crt
      PERI_TLS_KEY: /run/tls/tls.key
      PERI_TLS_CA: /run/tls/ca.crt
    volumes:
      - type: bind
        source: ${PERI_DEV_STATE_DIR:-../../../deploy/dev-state}
        target: /data/peri
        bind:
          create_host_path: false
      - type: bind
        source: ../../../deploy/dev-tls
        target: /run/tls
        read_only: true
        bind:
          create_host_path: false
    stop_grace_period: 45s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
