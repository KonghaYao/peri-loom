[package]
name = "peri-loom-p0"
version = "0.1.0"
edition = "2021"
rust-version = "1.98"

[workspace]
exclude = ["turso"]

[dependencies]
turso_core = { path = "turso/core", default-features = false, features = ["fs", "uuid", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
anyhow = "1"

[dev-dependencies]
tempfile = "3"

[profile.dev]
debug = 1
