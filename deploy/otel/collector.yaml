# OpenTelemetry Collector（observability profile）
#
# 平台契约（架构 §17.10）：
#   Metrics -> Prometheus -> Grafana
#   Trace   -> OTLP Collector -> Tempo/兼容后端
#   Logs    -> structured JSON -> Loki/兼容后端
#
# 本文件为单机 Compose 的最小可用拓扑：接收 OTLP（gRPC/HTTP），
# trace 打到日志导出器（便于本地排障），metrics 暴露为 Prometheus 端点。

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch:
    timeout: 5s
    send_batch_size: 1024
  memory_limiter:
    check_interval: 2s
    limit_percentage: 75
    spike_limit_percentage: 20
  # 平台必须贯穿的 trace context（架构 §17.10）
  attributes/context:
    actions:
      - key: db_id
        action: upsert
      - key: worker_id
        action: upsert
      - key: owner_epoch
        action: upsert
      - key: tenant_id
        action: upsert

exporters:
  debug:
    verbosity: normal
  prometheus:
    endpoint: 0.0.0.0:8889
    resource_to_telemetry_conversion:
      enabled: true

extensions:
  health_check:
    endpoint: 0.0.0.0:13133

service:
  extensions: [health_check]
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, attributes/context, batch]
      exporters: [debug]
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [prometheus]
    logs:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [debug]
