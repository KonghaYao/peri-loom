services:
  app:
    image: ${PERI_IMAGE:?set a reviewed immutable image digest}
    init: true
    command: ["--run-dir", "/data/peri", "--backend", "s3", "--listen", "0.0.0.0:9443", "--tls", "--no-build"]
    ports:
      - "${PERI_BIND_IP:-127.0.0.1}:${PERI_GATEWAY_PORT:-9443}:9443"
    environment:
      PERI_TLS_CERT: /run/tls/tls.crt
      PERI_TLS_KEY: /run/tls/tls.key
      PERI_TLS_CA: /run/tls/ca.crt
      S3_ENDPOINT: ${S3_ENDPOINT:?set existing S3 endpoint}
      S3_BUCKET: ${S3_BUCKET:?set existing dedicated S3 bucket}
      S3_REGION: ${S3_REGION:?set S3 region}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?set S3 access key}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?set S3 secret key}
      S3_SESSION_TOKEN: ${S3_SESSION_TOKEN:-}
    volumes:
      - type: bind
        source: ./deploy/state
        target: /data/peri
        bind:
          create_host_path: false
      - type: bind
        source: ./deploy/tls
        target: /run/tls
        read_only: true
        bind:
          create_host_path: false
    stop_grace_period: 45s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
