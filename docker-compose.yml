# ============================================================================
# DB Platform 标准部署拓扑（架构 §17.14，冻结）
#
# 关键约束：
#   * Compose **不是** DB-per-container 调度器。DB Process 仍然是 db-worker 容器内部
#     由 Worker Supervisor 拉起的普通子进程。
#   * 默认只发布 web 的 HTTP 端口。db-server / Worker / WAL / PostgreSQL / 对象存储
#     的内部端口不直接暴露公网（生产配置下内部服务发布端口数 = 0）。
#   * 所有 service 必须提供 healthcheck；depends_on 只表达启动顺序，
#     服务自身仍必须实现 retry/backoff，不得把“容器已启动”视为下游 Ready。
#   * db-server 与 web 必须保持 stateless，可以随时重建。
#
# 国内网络：基础镜像请先执行 ./scripts/docker-pull.sh（通过 registry 镜像预拉并
# 重打成标准 tag），或把 IMAGE_REGISTRY 指向内网仓库。
# ============================================================================

name: db-platform

x-image: &image-registry "${IMAGE_REGISTRY:-}"

# 注意：锚点必须包含键名（logging:/restart:），否则 `<<:` 合并会把
# driver/options 直接摊到 service 根上，compose 校验会报 additional properties。
x-logging: &default-logging
  logging:
    driver: json-file
    options:
      max-size: "50m"
      max-file: "3"

x-restart: &default-restart
  restart: unless-stopped

services:
  # ------------------------------------------------------------------ Panel
  web:
    # 必须指向本仓库构建的镜像（内置 SPA 产物与反向代理配置），
    # 而不是 stock nginx 镜像 —— 否则 /api、/data 代理与 SPA 都不会生效。
    image: "${IMAGE_REGISTRY:-}db-platform/web:${PLATFORM_VERSION:-dev}"
    build:
      context: ./web
      dockerfile: Dockerfile
      args:
        NODE_IMAGE: "${IMAGE_REGISTRY:-}${NODE_IMAGE:-node:22-alpine}"
        NGINX_IMAGE: "${IMAGE_REGISTRY:-}${NGINX_IMAGE:-nginx:1.27-alpine}"
    ports:
      - "${WEB_PORT:-8080}:80"
    networks: [edge]
    depends_on:
      db-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/healthz"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    <<: [*default-logging, *default-restart]

  # ------------------------------------------------------------------ Server Plane
  db-server:
    image: "${IMAGE_REGISTRY:-}db-platform/db-server:${PLATFORM_VERSION:-dev}"
    build:
      context: .
      dockerfile: Dockerfile
      target: db-server
      args:
        RUST_IMAGE: "${IMAGE_REGISTRY:-}${RUST_IMAGE:-rust:1.98-slim-bookworm}"
        RUNTIME_IMAGE: "${IMAGE_REGISTRY:-}${RUNTIME_IMAGE:-debian:bookworm-slim}"
    environment:
      RUST_LOG: "${RUST_LOG:-info}"
      # 密码只从 secret 文件注入（架构 §17.14）：不得在环境变量里出现明文密码，
      # 否则会出现「PostgreSQL 用 secret 初始化、db-server 用 .env 连接」的双事实源。
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: "${POSTGRES_DB:-dbplatform}"
      DB_USER: "${POSTGRES_USER:-dbplatform}"
      DB_PASSWORD_FILE: /run/secrets/postgres_password
      CATALOG_MAX_CONNECTIONS: "${CATALOG_MAX_CONNECTIONS:-32}"
      SERVER_HTTP_LISTEN: "0.0.0.0:8080"
      SERVER_GRPC_LISTEN: "0.0.0.0:8081"
      OPS_LISTEN: "0.0.0.0:9090"
      PLATFORM_MIGRATIONS_DIR: /opt/db-platform/migrations
      ROUTE_RECONCILE_INTERVAL_MS: "${ROUTE_RECONCILE_INTERVAL_MS:-5000}"
      WAKEUP_TIMEOUT_MS: "${WAKEUP_TIMEOUT_MS:-3000}"
      SESSION_IDLE_TIMEOUT_MS: "${SESSION_IDLE_TIMEOUT_MS:-60000}"
      TRANSACTION_MAX_LIFETIME_MS: "${TRANSACTION_MAX_LIFETIME_MS:-30000}"
      INLINE_RESULT_LIMIT_BYTES: "${INLINE_RESULT_LIMIT_BYTES:-262144}"
      JWT_SECRET_FILE: /run/secrets/jwt_secret
      JWT_ISSUER: "${JWT_ISSUER:-db-platform}"
      JWT_TTL_SECONDS: "${JWT_TTL_SECONDS:-3600}"
      BOOTSTRAP_ADMIN_USER: "${BOOTSTRAP_ADMIN_USER:-admin}"
      BOOTSTRAP_ADMIN_PASSWORD_FILE: /run/secrets/bootstrap_admin_password
      S3_ENDPOINT: "http://object-store:9000"
      S3_REGION: "${S3_REGION:-us-east-1}"
      S3_BUCKET: "${S3_BUCKET:-db-platform-snapshots}"
      S3_ACCESS_KEY_ID_FILE: /run/secrets/s3_access_key
      S3_SECRET_ACCESS_KEY_FILE: /run/secrets/s3_secret_key
      S3_FORCE_PATH_STYLE: "true"
      # 控制面只读 WAL 状态：启动被 Storage-level Fencing 拒绝时，需要读回 WAL 已记录的
      # owner epoch 才能把 Catalog 对齐到存储层权威（架构 §11.3）。与 Worker 用同一份
      # 拓扑配置，保证两边推导出的端点完全一致。
      WAL_CLUSTER: "${WAL_CLUSTER:-1@wal-1:9201,2@wal-2:9201,3@wal-3:9201}"
      OTEL_EXPORTER_OTLP_ENDPOINT: "${OTEL_EXPORTER_OTLP_ENDPOINT:-}"
    secrets:
      - postgres_password
      - jwt_secret
      - bootstrap_admin_password
      - s3_access_key
      - s3_secret_key
    networks: [edge, internal]
    depends_on:
      postgres:
        condition: service_healthy
    # 开发调试用（SDK 直连）；生产配置请保持注释，只经 web 暴露
    # ports:
    #   - "${DB_SERVER_DEV_PORT:-18080}:8080"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/readyz"]
      interval: 5s
      timeout: 3s
      retries: 24
      start_period: 15s
    <<: [*default-logging, *default-restart]

  # ------------------------------------------------------------------ PostgreSQL Catalog
  postgres:
    image: "${IMAGE_REGISTRY:-}${POSTGRES_IMAGE:-postgres:16-alpine}"
    environment:
      POSTGRES_DB: "${POSTGRES_DB:-dbplatform}"
      POSTGRES_USER: "${POSTGRES_USER:-dbplatform}"
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      # 控制面需要并发事务与 advisory lock，连接数按 Server 规模设置
      POSTGRES_INITDB_ARGS: "--data-checksums"
    secrets:
      - postgres_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dbplatform} -d ${POSTGRES_DB:-dbplatform}"]
      interval: 3s
      timeout: 3s
      retries: 30
      start_period: 5s
    <<: [*default-logging, *default-restart]
    # 不发布端口：PostgreSQL 只在内网可达

  # ------------------------------------------------------------------ Worker Plane
  db-worker-1:
    image: "${IMAGE_REGISTRY:-}db-platform/db-worker:${PLATFORM_VERSION:-dev}"
    build:
      context: .
      dockerfile: Dockerfile
      target: db-worker
      args:
        RUST_IMAGE: "${IMAGE_REGISTRY:-}${RUST_IMAGE:-rust:1.98-slim-bookworm}"
        RUNTIME_IMAGE: "${IMAGE_REGISTRY:-}${RUNTIME_IMAGE:-debian:bookworm-slim}"
    environment:
      RUST_LOG: "${RUST_LOG:-info}"
      WORKER_ID: worker-1
      WORKER_CONTROL_LISTEN: "0.0.0.0:9100"
      WORKER_DATA_LISTEN: "0.0.0.0:9101"
      OPS_LISTEN: "0.0.0.0:9090"
      SERVER_CONTROL_ENDPOINT: "http://db-server:8081"
      # 对外通告地址必须可被 db-server 解析：监听地址是 0.0.0.0，不能作为路由目标。
      WORKER_ADVERTISE_ENDPOINT: "db-worker-1:9100"
      WORKER_ADVERTISE_DATA_ENDPOINT: "db-worker-1:9101"
      WORKER_DATA_DIR: /var/lib/db-platform
      WORKER_RUN_DIR: /run/db-platform
      WORKER_CPU_MILLI: "${WORKER_CPU_MILLI:-32000}"
      WORKER_MEMORY_MIB: "${WORKER_MEMORY_MIB:-131072}"
      WORKER_DISK_MIB: "${WORKER_DISK_MIB:-512000}"
      WORKER_PROCESS_SLOTS: "${WORKER_PROCESS_SLOTS:-2048}"
      WORKER_MAX_DB_PROCESS: "${WORKER_MAX_DB_PROCESS:-2000}"
      HEARTBEAT_INTERVAL_MS: "${HEARTBEAT_INTERVAL_MS:-1000}"
      CGROUP_ROOT: "${WORKER_CGROUP_ROOT:-/sys/fs/cgroup}"
      DB_RUNTIME_BIN: /usr/local/bin/db-runtime
      WAL_CLUSTER: "${WAL_CLUSTER:-1@wal-1:9201,2@wal-2:9201,3@wal-3:9201}"
      S3_ENDPOINT: "http://object-store:9000"
      S3_BUCKET: "${S3_BUCKET:-db-platform-snapshots}"
      S3_ACCESS_KEY_ID_FILE: /run/secrets/s3_access_key
      S3_SECRET_ACCESS_KEY_FILE: /run/secrets/s3_secret_key
      S3_FORCE_PATH_STYLE: "true"
    secrets:
      - s3_access_key
      - s3_secret_key
    # Worker 需要创建 per-DB cgroup 并管理大量子进程（架构 §17.14）。
    # 这里采用最小化收敛：host cgroup namespace + SYS_ADMIN + 读写挂载 /sys/fs/cgroup。
    # 若内核/容器运行时不允许委派，可退回 privileged: true（不改变“DB Process 是
    # 普通子进程”的模型）。
    cgroup: host
    cap_add:
      - SYS_ADMIN
      - SYS_NICE
    security_opt:
      - apparmor:unconfined
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
      - worker_data_1:/var/lib/db-platform
      - worker_run_1:/run/db-platform
    tmpfs:
      - /run/db-platform/sockets:mode=0755
    networks: [internal]
    depends_on:
      db-server:
        condition: service_healthy
      wal-1:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9090/healthz"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    <<: [*default-logging, *default-restart]

  db-worker-2:
    extends:
      service: db-worker-1
    environment:
      WORKER_ID: worker-2
      WORKER_ADVERTISE_ENDPOINT: "db-worker-2:9100"
      WORKER_ADVERTISE_DATA_ENDPOINT: "db-worker-2:9101"
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
      - worker_data_2:/var/lib/db-platform
      - worker_run_2:/run/db-platform
    tmpfs:
      - /run/db-platform/sockets:mode=0755

  db-worker-3:
    extends:
      service: db-worker-1
    environment:
      WORKER_ID: worker-3
      WORKER_ADVERTISE_ENDPOINT: "db-worker-3:9100"
      WORKER_ADVERTISE_DATA_ENDPOINT: "db-worker-3:9101"
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
      - worker_data_3:/var/lib/db-platform
      - worker_run_3:/run/db-platform
    tmpfs:
      - /run/db-platform/sockets:mode=0755

  # ------------------------------------------------------------------ Storage Plane: Remote WAL
  # 基线部署 = 一个 3 副本 Raft WAL Group（架构 §17.14）
  wal-1:
    image: "${IMAGE_REGISTRY:-}db-platform/wal-service:${PLATFORM_VERSION:-dev}"
    build:
      context: .
      dockerfile: Dockerfile
      target: wal-service
      args:
        RUST_IMAGE: "${IMAGE_REGISTRY:-}${RUST_IMAGE:-rust:1.98-slim-bookworm}"
        RUNTIME_IMAGE: "${IMAGE_REGISTRY:-}${RUNTIME_IMAGE:-debian:bookworm-slim}"
    environment: &wal-env
      RUST_LOG: "${RUST_LOG:-info}"
      WAL_NODE_ID: "1"
      WAL_SHARD_ID: shard-0
      WAL_LISTEN: "0.0.0.0:9200"
      WAL_PEER_LISTEN: "0.0.0.0:9201"
      OPS_LISTEN: "0.0.0.0:9300"
      WAL_DATA_DIR: /var/lib/db-platform/wal
      WAL_CLUSTER: "${WAL_CLUSTER:-1@wal-1:9201,2@wal-2:9201,3@wal-3:9201}"
      WAL_APPEND_TIMEOUT_MS: "${WAL_APPEND_TIMEOUT_MS:-5000}"
      WAL_TRIM_INTERVAL_MS: "${WAL_TRIM_INTERVAL_MS:-60000}"
      S3_ENDPOINT: "http://object-store:9000"
    volumes:
      - wal_data_1:/var/lib/db-platform/wal
    networks: [internal]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9300/healthz"]
      interval: 3s
      timeout: 3s
      retries: 30
      start_period: 5s
    <<: [*default-logging, *default-restart]

  wal-2:
    extends:
      service: wal-1
    environment:
      <<: *wal-env
      WAL_NODE_ID: "2"
    volumes:
      - wal_data_2:/var/lib/db-platform/wal

  wal-3:
    extends:
      service: wal-1
    environment:
      <<: *wal-env
      WAL_NODE_ID: "3"
    volumes:
      - wal_data_3:/var/lib/db-platform/wal

  # ------------------------------------------------------------------ S3-compatible ObjectStore
  # Snapshot / Backup 的长期持久化（架构 §17.9）。
  #
  # 为什么是 RustFS 而不是 MinIO：MinIO 社区版自 2025 年起停止发布官方镜像并转向
  # AGPLv3 授权，不再适合作为平台默认依赖。RustFS 同样是 S3 兼容对象存储、
  # Apache-2.0 授权、支持 path-style 与 *_FILE 形式的凭据注入。
  # 平台侧只依赖 ObjectStore interface 与 S3 API，可随时替换为 AWS S3 / Ceph RGW 等。
  #
  # 版本固定在 1.0.0：同 digest 的 latest 与 1.0.0 实测正常，而更早的 1.0.0-alpha.72
  # 在本机会在启动后 panic（crc-fast 报 "x86 features missing (SSE4.1 && PCLMULQDQ)"）后退出。
  # 不要因为“看起来更新”就换回 alpha 标签，也不要用 latest（不可复现）。
  object-store:
    image: "${IMAGE_REGISTRY:-}${OBJECT_STORE_IMAGE:-rustfs/rustfs:1.0.0}"
    # RustFS 默认以非 root 用户（uid 10001）运行，卷目录需要先归它所有
    user: "10001:10001"
    environment:
      RUSTFS_VOLUMES: /data
      RUSTFS_ADDRESS: ":9000"
      RUSTFS_CONSOLE_ENABLE: "false"
      # 凭据走文件注入（与 §17.14 的 secrets 契约一致），不落到环境变量明文里
      RUSTFS_ACCESS_KEY_FILE: /run/secrets/s3_access_key
      RUSTFS_SECRET_KEY_FILE: /run/secrets/s3_secret_key
      RUSTFS_OBS_LOGGER_LEVEL: warn
    secrets:
      - s3_access_key
      - s3_secret_key
    volumes:
      - object_store_data:/data
      - object_store_logs:/logs
    networks: [internal]
    healthcheck:
      # RustFS 在 S3 端口上提供 /health
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9000/health"]
      interval: 3s
      timeout: 3s
      retries: 30
      start_period: 5s
    <<: [*default-logging, *default-restart]

  # 卷目录属主修正：RustFS 以 uid 10001 运行，而 named volume 默认属于 root。
  # 用一次性 init 容器把它准备好，避免让对象存储进程以 root 运行。
  object-store-init:
    image: "${IMAGE_REGISTRY:-}${RUNTIME_IMAGE:-debian:bookworm-slim}"
    user: "0:0"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        chown -R 10001:10001 /data /logs
        echo "object store volumes ready"
    volumes:
      - object_store_data:/data
      - object_store_logs:/logs
    networks: [internal]
    restart: "no"

  # ------------------------------------------------------------------ Observability（可选 profile）
  otel-collector:
    image: "${IMAGE_REGISTRY:-}otel/opentelemetry-collector-contrib:0.121.0"
    profiles: ["observability"]
    command: ["--config=/etc/otel/collector.yaml"]
    volumes:
      - ./deploy/otel/collector.yaml:/etc/otel/collector.yaml:ro
    networks: [internal]
    healthcheck:
      test: ["CMD", "/otelcol-contrib", "--version"]
      interval: 10s
      timeout: 5s
      retries: 6
    <<: [*default-logging, *default-restart]

  prometheus:
    image: "${IMAGE_REGISTRY:-}prom/prometheus:v2.55.1"
    profiles: ["observability"]
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=7d"
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    networks: [internal]
    <<: [*default-logging, *default-restart]

  grafana:
    image: "${IMAGE_REGISTRY:-}grafana/grafana:11.4.0"
    profiles: ["observability"]
    environment:
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/secrets/grafana_admin_password
      GF_USERS_ALLOW_SIGN_UP: "false"
    secrets:
      - grafana_admin_password
    volumes:
      - grafana_data:/var/lib/grafana
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
    networks: [internal]
    <<: [*default-logging, *default-restart]

networks:
  # 只承载 web <-> db-server
  edge:
    driver: bridge
  # 控制面、数据面、存储面全部走内网，不对宿主机发布端口
  internal:
    driver: bridge
    internal: false

volumes:
  postgres_data:
  wal_data_1:
  wal_data_2:
  wal_data_3:
  object_store_data:
  object_store_logs:
  worker_data_1:
  worker_data_2:
  worker_data_3:
  worker_run_1:
  worker_run_2:
  worker_run_3:
  prometheus_data:
  grafana_data:

secrets:
  postgres_password:
    file: ./deploy/secrets/postgres_password.txt
  jwt_secret:
    file: ./deploy/secrets/jwt_secret.txt
  bootstrap_admin_password:
    file: ./deploy/secrets/bootstrap_admin_password.txt
  s3_access_key:
    file: ./deploy/secrets/s3_access_key.txt
  s3_secret_key:
    file: ./deploy/secrets/s3_secret_key.txt
  grafana_admin_password:
    file: ./deploy/secrets/grafana_admin_password.txt
